<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #eef2ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }
        .register-card {
            width: min(520px, 100%);
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand {
            width: 62px;
            height: 62px;
            margin: 0 auto 12px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
            color: white;
            font-size: 26px;
        }
        h2 {
            margin: 8px 0 8px;
            color: #0f172a;
            font-size: 2rem;
        }
        p {
            margin: 0;
            color: #64748b;
        }
        .alert {
            margin: 18px 0;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
        }
        .alert.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .input-group { position: relative; }
        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        .input-group input {
            width: 100%;
            border: 1px solid #dbe3f0;
            border-radius: 14px;
            font-size: 1rem;
            padding: 16px 18px 16px 46px;
            outline: none;
            transition: all 0.2s;
        }
        .input-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }
        .submit-btn {
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            padding: 16px 18px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 18px 33px rgba(37,99,235,0.22);
        }
        .bottom-link {
            text-align: center;
            margin-top: 16px;
            color: #475569;
        }
        .bottom-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="register-card">
    <div class="header">
        <div class="brand"><i class="fa-solid fa-user-plus"></i></div>
        <h2>Create account</h2>
        <p>Join the hospital system to manage your profile and access your dashboard.</p>
    </div>

    <div th:if="${error != null}" class="alert error" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" th:field="*{fullName}" placeholder="Full name" required>
        </div>
        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" th:field="*{email}" placeholder="Email address" required>
        </div>
        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" th:field="*{password}" placeholder="Password" required>
        </div>
        <button type="submit" class="submit-btn">Register now</button>
    </form>

    <div class="bottom-link">
        Already have an account? <a th:href="@{/login}">Login here</a>
    </div>
</div>
</body>
</html>
