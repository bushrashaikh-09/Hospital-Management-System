<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Doctors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --sidebar: #0f172a;
            --sidebar-light: #1e293b;
            --card: #ffffff;
            --primary: #2563eb;
            --primary-soft: #dbeafe;
            --text: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --success: #16a34a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .app-shell { display: flex; min-height: 100vh; }
        .sidebar {
            width: 270px;
            background: linear-gradient(180deg, var(--sidebar) 0%, var(--sidebar-light) 100%);
            color: #fff;
            padding: 22px 18px;
            position: relative;
            transition: width 0.25s ease;
        }
        .sidebar.collapsed { width: 92px; }
        .sidebar.collapsed .nav-text, .sidebar.collapsed .brand-name, .sidebar.collapsed .user-meta { display: none; }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            padding: 14px 10px;
            border-radius: 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .brand-mark {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            display: grid; place-items: center;
            font-size: 18px;
        }
        .nav { display: flex; flex-direction: column; gap: 10px; }
        .nav a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            transition: 0.2s ease;
        }
        .nav a:hover, .nav a.active { background: rgba(59,130,246,0.18); color: #fff; }
        .nav i { width: 18px; text-align: center; }
        .logout-wrap {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 18px;
        }
        .logout-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: rgba(239,68,68,0.14);
            color: white;
            padding: 12px 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            text-decoration: none;
        }
        .content { flex: 1; }
        .topbar {
            background: rgba(255,255,255,0.8);
            border-bottom: 1px solid var(--line);
            padding: 18px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
        }
        .toggle-btn {
            width: 42px; height: 42px;
            border: 1px solid var(--line);
            background: white;
            border-radius: 12px;
            cursor: pointer;
        }
        .user-pill {
            display: flex; align-items: center; gap: 12px;
            background: white; border: 1px solid var(--line); border-radius: 12px;
            padding: 8px 12px;
        }
        .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            display: grid; place-items: center; color: white; font-weight: 700;
        }
        .main { padding: 26px; }
        .hero {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1px solid #dfe9ff;
            border-radius: 22px;
            padding: 28px;
            margin-bottom: 26px;
        }
        .hero h2 { margin: 0 0 8px; font-size: clamp(1.8rem, 2vw, 2.5rem); }
        .hero p { margin: 0; color: var(--muted); }
        .toolbar {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .toolbar input,
        .toolbar select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
            font: inherit;
            background: #fff;
            color: var(--text);
        }
        .toolbar .search-wrap { flex: 1 1 260px; }
        .toolbar .filter-wrap { flex: 0 0 220px; }
        .doctor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
        }
        .doctor-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 12px 25px rgba(15,23,42,0.04);
        }
        .doctor-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
        }
        .doctor-avatar {
            width: 52px; height: 52px; border-radius: 50%;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            display: grid; place-items: center; color: white; font-weight: 700;
        }
        .specialty {
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 4px;
        }
        .service-list {
            list-style: none; padding: 0; margin: 15px 0 0;
            display: grid; gap: 8px;
        }
        .service-list li {
            display: flex; align-items: center; gap: 8px;
            color: var(--muted); font-size: 0.86rem;
        }
        .service-list li::before {
            content: "•"; color: var(--success); font-size: 1.2rem;
        }
        .book-btn {
            margin-top: 16px; width: 100%;
            border: none; background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white; border-radius: 12px; padding: 11px 14px; font-weight: 700; cursor: pointer;
        }
        @media (max-width: 980px) {
            .doctor-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark"><i class="fa-solid fa-hospital"></i></div>
            <div class="brand-name">CareConnect</div>
        </div>

        <nav class="nav">
            <a href="/user/dashboard"><i class="fa-solid fa-gauge"></i><span class="nav-text">Dashboard</span></a>
            <a href="/user/profile"><i class="fa-solid fa-user"></i><span class="nav-text">Profile</span></a>
            <a class="active" href="/user/doctors"><i class="fa-solid fa-user-doctor"></i><span class="nav-text">Doctors</span></a>
            <a href="/user/appointments"><i class="fa-solid fa-calendar-check"></i><span class="nav-text">Appointments</span></a>
            <a href="/user/reports"><i class="fa-solid fa-file-medical"></i><span class="nav-text">Reports</span></a>
            <a href="/user/settings"><i class="fa-solid fa-gear"></i><span class="nav-text">Settings</span></a>
        </nav>

        <div class="logout-wrap">
            <a class="logout-btn" href="/logout"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
        </div>
    </aside>

    <div class="content">
        <header class="topbar">
            <button class="toggle-btn" id="toggleSidebar" aria-label="Toggle sidebar"><i class="fa-solid fa-bars"></i></button>
            <div class="user-pill">
                <div class="avatar" th:text="${#strings.substring(user.fullName,0,1)}">U</div>
                <div>
                    <div style="font-weight:700;" th:text="${user.fullName}">User</div>
                    <div style="font-size:0.72rem; color: var(--muted);" class="user-meta">Patient Portal</div>
                </div>
            </div>
        </header>

        <main class="main">
            <section class="hero">
                <div>
                    <h2>Our doctors</h2>
                    <p>Consult experienced specialists for general care, diagnostics, and treatment planning.</p>
                </div>
            </section>

            <div class="toolbar">
                <div class="search-wrap">
                    <input id="doctorSearch" type="text" placeholder="Search doctors or specialties" />
                </div>
                <div class="filter-wrap">
                    <select id="doctorFilter">
                        <option value="all">All specialties</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Neurology">Neurology</option>
                        <option value="Dermatology">Dermatology</option>
                        <option value="Orthopedics">Orthopedics</option>
                        <option value="Pediatrics">Pediatrics</option>
                        <option value="General Medicine">General Medicine</option>
                        <option value="Gynecology">Gynecology</option>
                        <option value="Oncology">Oncology</option>
                        <option value="ENT">ENT</option>
                        <option value="Endocrinology">Endocrinology</option>
                        <option value="Gastroenterology">Gastroenterology</option>
                        <option value="Pulmonology">Pulmonology</option>
                        <option value="Psychiatry">Psychiatry</option>
                        <option value="Urology">Urology</option>
                        <option value="Rheumatology">Rheumatology</option>
                        <option value="Nephrology">Nephrology</option>
                    </select>
                </div>
            </div>

            <section class="doctor-grid" id="doctorGrid"></section>
        </main>
    </div>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const userName = "[[${user.fullName}]]";
    document.body.dataset.userName = userName;

    document.getElementById('toggleSidebar').addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
    });

    function normalizeDoctor(doctor) {
        return {
            name: (doctor && doctor.name) ? doctor.name.trim() : 'New Doctor',
            specialty: (doctor && doctor.specialty) ? doctor.specialty.trim() : 'General Medicine',
            services: Array.isArray(doctor && doctor.services)
                ? doctor.services.map(item => String(item).trim()).filter(Boolean)
                : String(doctor && doctor.services || '').split(',').map(item => item.trim()).filter(Boolean)
        };
    }

    async function getDoctors() {
        const response = await fetch('/api/doctors');
        if (!response.ok) throw new Error('Unable to load doctors');
        return (await response.json()).map(normalizeDoctor);
    }

    function getInitials(name) {
        return name.split(' ').filter(Boolean).slice(0, 2).map(word => word[0]).join('').toUpperCase();
    }

    async function renderDoctorCards() {
        const query = (document.getElementById('doctorSearch')?.value || '').trim().toLowerCase();
        const selectedSpecialty = document.getElementById('doctorFilter')?.value || 'all';
        const doctors = (await getDoctors()).filter((doctor) => {
            const matchesSearch = !query || doctor.name.toLowerCase().includes(query) || doctor.specialty.toLowerCase().includes(query);
            const matchesSpecialty = selectedSpecialty === 'all' || doctor.specialty === selectedSpecialty;
            return matchesSearch && matchesSpecialty;
        });
        const grid = document.getElementById('doctorGrid');

        grid.innerHTML = doctors.map((doctor) => `
            <div class="doctor-card">
                <div class="doctor-header">
                    <div class="doctor-avatar">${getInitials(doctor.name)}</div>
                    <div>
                        <div style="font-weight:800;">${doctor.name}</div>
                        <div class="specialty">${doctor.specialty}</div>
                    </div>
                </div>
                <ul class="service-list">
                    ${doctor.services.map(service => `<li>${service}</li>`).join('')}
                </ul>
                <button class="book-btn" data-doctor="${doctor.name}" data-department="${doctor.specialty}">Book appointment</button>
            </div>
        `).join('');

        document.querySelectorAll('.book-btn').forEach(button => {
            button.addEventListener('click', () => openBookingModal(button.dataset.doctor || 'Doctor', button.dataset.department || 'General Medicine'));
        });
    }

    function openBookingModal(doctorName, department) {
        const existing = document.getElementById('appointmentModal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.id = 'appointmentModal';
        modal.style.position = 'fixed';
        modal.style.inset = '0';
        modal.style.background = 'rgba(15, 23, 42, 0.45)';
        modal.style.display = 'grid';
        modal.style.placeItems = 'center';
        modal.style.zIndex = '1000';
        modal.innerHTML = `
            <div style="background:white; width:min(560px, 92vw); border-radius:18px; padding:24px; box-shadow:0 18px 45px rgba(15,23,42,0.2);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h3 style="margin:0;">Book appointment</h3>
                    <button type="button" id="closeAppointmentModal" style="border:none; background:#eff6ff; color:#1d4ed8; border-radius:10px; width:36px; height:36px; cursor:pointer; font-weight:700;">×</button>
                </div>
                <form id="doctorAppointmentForm">
                    <div style="display:grid; gap:14px;">
                        <div>
                            <label style="display:block; margin-bottom:6px; font-weight:600;">Patient</label>
                            <input type="text" value="${userName}" readonly style="width:100%; border:1px solid #dbeafe; border-radius:10px; padding:10px 12px;">
                        </div>
                        <div>
                            <label style="display:block; margin-bottom:6px; font-weight:600;">Doctor</label>
                            <input type="text" value="${doctorName}" readonly style="width:100%; border:1px solid #dbeafe; border-radius:10px; padding:10px 12px;">
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                            <div>
                                <label style="display:block; margin-bottom:6px; font-weight:600;">Date</label>
                                <input type="date" id="appointmentDate" min="${new Date().toISOString().split('T')[0]}" required style="width:100%; border:1px solid #dbeafe; border-radius:10px; padding:10px 12px;">
                            </div>
                            <div>
                                <label style="display:block; margin-bottom:6px; font-weight:600;">Time</label>
                                <input type="time" id="appointmentTime" required style="width:100%; border:1px solid #dbeafe; border-radius:10px; padding:10px 12px;" readonly>
                            </div>
                        </div>
                        <div>
                            <label style="display:block; margin-bottom:6px; font-weight:600;">Available time slots</label>
                            <div id="slotPicker" style="display:flex; flex-wrap:wrap; gap:8px; min-height:44px;"></div>
                        </div>
                        <div>
                            <label style="display:block; margin-bottom:6px; font-weight:600;">Notes</label>
                            <textarea id="appointmentNotes" rows="3" style="width:100%; border:1px solid #dbeafe; border-radius:10px; padding:10px 12px; resize:vertical;">General consultation</textarea>
                        </div>
                        <button type="submit" style="border:none; background:linear-gradient(135deg, #2563eb, #0ea5e9); color:white; border-radius:12px; padding:12px 16px; font-weight:700; cursor:pointer;">Confirm booking</button>
                    </div>
                </form>
            </div>
        `;

        document.body.appendChild(modal);

        const dateField = document.getElementById('appointmentDate');
        const timeField = document.getElementById('appointmentTime');
        const slotPicker = document.getElementById('slotPicker');

        const updateSlots = async () => {
            const selectedDate = dateField.value;
            if (!selectedDate) {
                slotPicker.innerHTML = '<span style="color:#64748b;">Choose a date to view available times.</span>';
                timeField.value = '';
                return;
            }

            const response = await fetch(`/api/appointments/availability?doctorName=${encodeURIComponent(doctorName)}&date=${selectedDate}`);
            if (!response.ok) {
                slotPicker.innerHTML = '<span style="color:#b91c1c;">Unable to load availability right now.</span>';
                return;
            }

            const data = await response.json();
            const slots = Array.isArray(data.availableSlots) ? data.availableSlots : [];
            if (!slots.length) {
                slotPicker.innerHTML = '<span style="color:#b91c1c;">No time slots are available for this doctor on the selected date.</span>';
                timeField.value = '';
                return;
            }

            slotPicker.innerHTML = slots.map(slot => `
                <button type="button" class="slot-btn" data-slot="${slot}" style="padding:8px 10px; border:1px solid #bfdbfe; border-radius:10px; background:#eff6ff; color:#1d4ed8; cursor:pointer; font-weight:600;">${slot}</button>
            `).join('');

            slotPicker.querySelectorAll('.slot-btn').forEach(button => {
                button.addEventListener('click', () => {
                    slotPicker.querySelectorAll('.slot-btn').forEach(btn => {
                        btn.style.background = '#eff6ff';
                        btn.style.color = '#1d4ed8';
                    });
                    button.style.background = '#2563eb';
                    button.style.color = '#fff';
                    timeField.value = button.dataset.slot;
                });
            });
        };

        dateField.addEventListener('change', updateSlots);
        updateSlots();

        document.getElementById('closeAppointmentModal').addEventListener('click', () => modal.remove());
        document.getElementById('doctorAppointmentForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const selectedTime = document.getElementById('appointmentTime').value;
            if (!selectedTime) {
                alert('Please choose an available time slot before confirming the booking.');
                return;
            }

            const response = await fetch('/api/appointments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    patientName: userName,
                    doctorName,
                    department,
                    appointmentDate: document.getElementById('appointmentDate').value,
                    appointmentTime: selectedTime,
                    notes: document.getElementById('appointmentNotes').value
                })
            });
            if (!response.ok) {
                const errorMessage = await response.text();
                alert(errorMessage || 'The appointment could not be saved. Please try another time slot.');
                return;
            }
            window.location.href = '/user/appointments';
        });
    }

    const doctorSearchInput = document.getElementById('doctorSearch');
    const doctorFilterSelect = document.getElementById('doctorFilter');

    if (doctorSearchInput) {
        doctorSearchInput.addEventListener('input', renderDoctorCards);
    }
    if (doctorFilterSelect) {
        doctorFilterSelect.addEventListener('change', renderDoctorCards);
    }
    renderDoctorCards().catch(() => {
        document.getElementById('doctorGrid').innerHTML = '<p>Unable to load doctors from the database.</p>';
    });
</script>
</body>
</html>
