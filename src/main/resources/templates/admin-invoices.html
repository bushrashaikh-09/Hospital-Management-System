<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invoice Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.0/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg:#f8fafc; --card:#ffffff; --primary:#2563eb; --primary-soft:#dbeafe; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --success:#16a34a; --warning:#eab308; --danger:#dc2626;
        }
        * { box-sizing: border-box; }
        body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .title { font-size: 2rem; font-weight:800; }
        .actions { display:flex; gap:12px; }
        .btn { border:none; border-radius:12px; padding:12px 16px; font-weight:700; cursor:pointer; }
        .btn-primary { background:linear-gradient(135deg,#2563eb,#0ea5e9); color:#fff; }
        .btn-secondary { background:#eef2ff; color:#312e81; }
        .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 16px 35px rgba(15,23,42,0.04); }
        .grid { display:grid; grid-template-columns: 1.3fr 1fr; gap:24px; }
        form { display:grid; gap:14px; }
        .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        label { display:block; font-weight:600; margin-bottom:6px; }
        input, select, textarea { width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; background:#fff; }
        textarea { min-height:90px; resize:vertical; }
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th, td { text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); }
        th { color:var(--muted); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.06em; }
        .status { display:inline-flex; padding:6px 10px; border-radius:999px; font-size:0.72rem; font-weight:700; }
        .status.pending { background:#fef3c7; color:#92400e; }
        .status.paid { background:#dcfce7; color:#166534; }
        .status.overdue { background:#fee2e2; color:#991b1b; }
        .status.cancelled { background:#e2e8f0; color:#334155; }
        .muted { color:var(--muted); }
        .empty { text-align:center; color:var(--muted); padding:24px; }
        .small-note { font-size:0.82rem; color:var(--muted); }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <div>
            <div class="small-note">Admin billing</div>
            <div class="title">Invoice Management</div>
        </div>
        <div class="actions">
            <a class="btn btn-secondary" href="/admin/dashboard" style="text-decoration:none; display:inline-block;">Back to dashboard</a>
            <a class="btn btn-secondary" href="/admin/payments" style="text-decoration:none; display:inline-block;">Payment history</a>
            <button class="btn btn-primary" type="button" id="resetForm">New invoice</button>
        </div>
    </div>

    <div class="card">
        <div class="grid">
            <div>
                <h3 style="margin-top:0;">Create or update invoice</h3>
                <form id="invoiceForm">
                    <input type="hidden" id="invoiceId">
                    <div class="two-col">
                        <div>
                            <label>Patient name</label>
                            <input id="patientName" required>
                        </div>
                        <div>
                            <label>Doctor name</label>
                            <input id="doctorName" required>
                        </div>
                    </div>
                    <div class="two-col">
                        <div>
                            <label>Department</label>
                            <input id="department" required>
                        </div>
                        <div>
                            <label>Appointment date</label>
                            <input type="date" id="appointmentDate">
                        </div>
                    </div>
                    <div class="two-col">
                        <div>
                            <label>Invoice date</label>
                            <input type="date" id="invoiceDate" required>
                        </div>
                        <div>
                            <label>Due date</label>
                            <input type="date" id="dueDate">
                        </div>
                    </div>
                    <div class="two-col">
                        <div>
                            <label>Amount</label>
                            <input id="amount" type="number" min="0" step="0.01" required>
                        </div>
                        <div>
                            <label>Status</label>
                            <select id="status">
                                <option value="Pending">Pending</option>
                                <option value="Paid">Paid</option>
                                <option value="Overdue">Overdue</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label>Notes</label>
                        <textarea id="notes" placeholder="Consultation, procedure, or payment notes"></textarea>
                    </div>
                    <div style="display:flex; gap:12px;">
                        <button class="btn btn-primary" type="submit">Save invoice</button>
                        <button class="btn btn-secondary" type="button" id="cancelEdit">Cancel</button>
                    </div>
                </form>
            </div>
            <div>
                <h3 style="margin-top:0;">Invoice summary</h3>
                <div class="card" style="padding:18px; background:#f8fafc;">
                    <div class="small-note">Total billed</div>
                    <div id="totalAmount" style="font-size:2rem; font-weight:800; margin:6px 0 12px;">₹0.00</div>
                    <div class="small-note">Pending payments</div>
                    <div id="pendingPayments" style="font-size:1.4rem; font-weight:700; margin-top:6px;">0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top:28px;">
        <h3 style="margin-top:0;">All invoices</h3>
        <table>
            <thead>
            <tr>
                <th>Invoice No.</th>
                <th>Patient</th>
                <th>Doctor</th>
                <th>Department</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Due Date</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="invoiceTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const invoiceForm = document.getElementById('invoiceForm');
    const invoiceTableBody = document.getElementById('invoiceTableBody');
    const totalAmount = document.getElementById('totalAmount');
    const pendingPayments = document.getElementById('pendingPayments');

    const formatCurrency = (value) => {
        const amount = Number(value || 0);
        return '₹' + amount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    function generateInvoicePdf(invoice) {
        if (!window.jspdf || !window.jspdf.jsPDF) {
            alert('PDF export is not available in this browser.');
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'pt', format: 'a4' });
        const pageWidth = doc.internal.pageSize.getWidth();
        const margin = 48;

        const invoiceNumber = invoice.invoiceNumber || 'N/A';
        const patientName = invoice.patientName || 'Patient';
        const doctorName = invoice.doctorName || 'Not Assigned';
        const department = invoice.department || 'General Care';
        const invoiceDate = invoice.invoiceDate || new Date().toISOString().slice(0, 10);
        const dueDate = invoice.dueDate || invoiceDate;
        const amount = Number(invoice.amount || 0);

        doc.setFillColor(15, 23, 42);
        doc.rect(0, 0, pageWidth, 88, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(18);
        doc.text('CareConnect Hospital', margin, 34);
        doc.setFontSize(24);
        doc.text('Invoice', margin, 64);

        doc.setTextColor(15, 23, 42);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(11);

        doc.setDrawColor(226, 232, 240);
        doc.setFillColor(248, 250, 252);
        doc.roundedRect(margin, 110, pageWidth - margin * 2, 170, 12, 12, 'FD');

        const infoX = margin + 20;
        doc.setFont('helvetica', 'bold');
        doc.text('Invoice No.', infoX, 145);
        doc.text('Patient', infoX + 210, 145);
        doc.text('Doctor', infoX, 185);
        doc.text('Department', infoX + 210, 185);
        doc.text('Invoice Date', infoX, 225);
        doc.text('Due Date', infoX + 210, 225);
        doc.text('Amount', infoX, 265);

        doc.setFont('helvetica', 'normal');
        doc.text(invoiceNumber, infoX, 162);
        doc.text(patientName, infoX + 210, 162);
        doc.text(doctorName, infoX, 202);
        doc.text(department, infoX + 210, 202);
        doc.text(invoiceDate, infoX, 242);
        doc.text(dueDate, infoX + 210, 242);
        doc.text(formatCurrency(amount), infoX, 282);

        doc.setFont('helvetica', 'bold');
        doc.text('Please settle the amount before the due date.', margin, 330);
        doc.setFont('helvetica', 'normal');
        doc.text('This invoice was generated by the hospital management system.', margin, 355);

        doc.save((invoiceNumber || 'invoice') + '.pdf');
    }

    function resetForm() {
        invoiceForm.reset();
        document.getElementById('invoiceId').value = '';
        document.getElementById('invoiceDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('status').value = 'Pending';
    }

    async function loadInvoices() {
        const response = await fetch('/api/invoices');
        if (!response.ok) {
            invoiceTableBody.innerHTML = '<tr><td colspan="8" class="empty">Unable to load invoices.</td></tr>';
            return;
        }

        const invoices = await response.json();
        if (!invoices.length) {
            invoiceTableBody.innerHTML = '<tr><td colspan="8" class="empty">No invoices created yet.</td></tr>';
            totalAmount.textContent = formatCurrency(0);
            pendingPayments.textContent = '0';
            return;
        }

        const total = invoices.reduce((sum, invoice) => sum + Number(invoice.amount || 0), 0);
        const pendingCount = invoices.filter(invoice => (invoice.status || '').toLowerCase() === 'pending').length;
        totalAmount.textContent = formatCurrency(total);
        pendingPayments.textContent = String(pendingCount);

        invoiceTableBody.innerHTML = invoices.map(invoice => `
            <tr>
                <td>${invoice.invoiceNumber || 'N/A'}</td>
                <td>${invoice.patientName || '-'}</td>
                <td>${invoice.doctorName || '-'}</td>
                <td>${invoice.department || '-'}</td>
                <td>${formatCurrency(invoice.amount)}</td>
                <td><span class="status ${String(invoice.status || 'pending').toLowerCase()}">${invoice.status || 'Pending'}</span></td>
                <td>${invoice.dueDate || '-'}</td>
                <td>
                    <button class="btn btn-secondary" type="button" data-edit="${invoice.id}" style="padding:8px 10px;">Edit</button>
                    <button class="btn btn-primary" type="button" data-export="${invoice.id}" style="padding:8px 10px; background:#0ea5e9; color:white;">PDF</button>
                    <button class="btn btn-primary" type="button" data-delete="${invoice.id}" style="padding:8px 10px; background:#ef4444; color:white;">Delete</button>
                </td>
            </tr>
        `).join('');

        document.querySelectorAll('[data-export]').forEach(button => {
            button.addEventListener('click', async () => {
                const invoiceId = button.dataset.export;
                const response = await fetch('/api/invoices');
                const invoicesData = await response.json();
                const invoice = invoicesData.find(item => String(item.id) === String(invoiceId));
                if (invoice) {
                    generateInvoicePdf(invoice);
                }
            });
        });

        document.querySelectorAll('[data-edit]').forEach(button => {
            button.addEventListener('click', async () => {
                const id = button.dataset.edit;
                const response = await fetch(`/api/invoices`);
                const invoicesData = await response.json();
                const invoice = invoicesData.find(item => String(item.id) === String(id));
                if (!invoice) return;

                document.getElementById('invoiceId').value = invoice.id;
                document.getElementById('patientName').value = invoice.patientName || '';
                document.getElementById('doctorName').value = invoice.doctorName || '';
                document.getElementById('department').value = invoice.department || '';
                document.getElementById('appointmentDate').value = invoice.appointmentDate || '';
                document.getElementById('invoiceDate').value = invoice.invoiceDate || new Date().toISOString().split('T')[0];
                document.getElementById('dueDate').value = invoice.dueDate || '';
                document.getElementById('amount').value = invoice.amount || 0;
                document.getElementById('status').value = invoice.status || 'Pending';
                document.getElementById('notes').value = invoice.notes || '';
            });
        });

        document.querySelectorAll('[data-delete]').forEach(button => {
            button.addEventListener('click', async () => {
                const confirmed = confirm('Delete this invoice?');
                if (!confirmed) return;
                const response = await fetch(`/api/invoices/${button.dataset.delete}`, { method: 'DELETE' });
                if (response.ok) {
                    loadInvoices();
                }
            });
        });
    }

    invoiceForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const id = document.getElementById('invoiceId').value;
        const payload = {
            patientName: document.getElementById('patientName').value,
            doctorName: document.getElementById('doctorName').value,
            department: document.getElementById('department').value,
            appointmentDate: document.getElementById('appointmentDate').value || null,
            invoiceDate: document.getElementById('invoiceDate').value,
            dueDate: document.getElementById('dueDate').value || null,
            amount: Number(document.getElementById('amount').value || 0),
            status: document.getElementById('status').value,
            notes: document.getElementById('notes').value
        };

        const url = id ? `/api/invoices/${id}` : '/api/invoices';
        const method = id ? 'PUT' : 'POST';

        const response = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            const error = await response.text();
            alert(error || 'Unable to save invoice.');
            return;
        }

        resetForm();
        loadInvoices();
    });

    document.getElementById('resetForm').addEventListener('click', resetForm);
    document.getElementById('cancelEdit').addEventListener('click', resetForm);
    resetForm();
    loadInvoices();
</script>
</body>
</html>
