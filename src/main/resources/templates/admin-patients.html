<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Patients</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root { --bg:#f3f7ff; --sidebar:#0f172a; --sidebar-light:#1e293b; --primary:#2563eb; --card:#fff; --line:#e2e8f0; --text:#0f172a; --muted:#64748b; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); }
        .app-shell { display:flex; min-height:100vh; }
        .sidebar { width:270px; background:linear-gradient(180deg, var(--sidebar), var(--sidebar-light)); color:white; padding:22px 18px; position:relative; transition: width 0.25s ease; }
        .sidebar.collapsed { width: 92px; }
        .sidebar.collapsed .nav-text, .sidebar.collapsed .brand-name, .sidebar.collapsed .user-meta { display:none; }
        .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; padding:14px 10px; border-radius:16px; background:rgba(255,255,255,0.04); }
        .brand-mark { width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,#60a5fa,#2563eb); display:grid; place-items:center; }
        .nav { display:flex; flex-direction:column; gap:10px; }
        .nav a { color:rgba(255,255,255,0.8); text-decoration:none; display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:12px; }
        .nav a.active, .nav a:hover { background:rgba(59,130,246,0.18); color:white; }
        .logout-wrap { position:absolute; left:18px; right:18px; bottom:18px; }
        .logout-btn { width:100%; border:none; border-radius:12px; background:rgba(239,68,68,0.14); color:white; padding:12px 14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; }
        .content { flex:1; }
        .topbar { display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.8); padding:18px 26px; border-bottom:1px solid var(--line); }
        .toggle-btn {
            width: 42px; height: 42px; border: 1px solid var(--line); background: white; border-radius: 12px; cursor: pointer;
        }
        .user-pill { display:flex; align-items:center; gap:12px; background:white; border:1px solid var(--line); border-radius:12px; padding:8px 12px; }
        .avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#60a5fa,#2563eb); display:grid; place-items:center; color:white; font-weight:700; }
        .main { padding:26px; }
        .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; }
        table { width:100%; border-collapse:collapse; margin-top:16px; }
        th, td { text-align:left; padding:14px 12px; border-bottom:1px solid var(--line); }
        .badge { display:inline-flex; align-items:center; padding:6px 10px; border-radius:999px; font-size:0.72rem; font-weight:700; }
        .badge.success { background:#dcfce7; color:#166534; }
        .badge.warning { background:#fef3c7; color:#92400e; }
        .action-btn, .row-edit-btn { border:none; border-radius:10px; background:#dbeafe; color:#1d4ed8; cursor:pointer; font-weight:700; padding:8px 12px; }
        .row-edit-btn.save-btn { background:#dcfce7; color:#166534; }
        input, select { border:1px solid #dbeafe; border-radius:8px; padding:8px 10px; }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark"><i class="fa-solid fa-hospital"></i></div>
            <div class="brand-name">CareConnect</div>
        </div>
        <nav class="nav">
            <a href="/admin/dashboard"><i class="fa-solid fa-gauge"></i><span class="nav-text">Dashboard</span></a>
            <a class="active" href="/admin/patients"><i class="fa-solid fa-user-injured"></i><span class="nav-text">Patients</span></a>
            <a href="/admin/appointments"><i class="fa-solid fa-calendar-check"></i><span class="nav-text">Appointments</span></a>
            <a href="/admin/reports"><i class="fa-solid fa-chart-line"></i><span class="nav-text">Reports</span></a>
            <a href="/admin/invoices"><i class="fa-solid fa-file-invoice-dollar"></i><span class="nav-text">Invoices</span></a>
            <a href="/admin/payments"><i class="fa-solid fa-money-bill-wave"></i><span class="nav-text">Payments</span></a>
            <a href="/admin/settings"><i class="fa-solid fa-gear"></i><span class="nav-text">Settings</span></a>
        </nav>
        <div class="logout-wrap">
            <a class="logout-btn" href="/logout"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
        </div>
    </aside>

    <div class="content">
        <header class="topbar">
            <button class="toggle-btn" id="toggleSidebar" aria-label="Toggle sidebar"><i class="fa-solid fa-bars"></i></button>
            <div style="font-weight:700; font-size:1.1rem;">Patient Management</div>
            <div class="user-pill">
                <div class="avatar" th:text="${#strings.substring(user.fullName,0,1)}">A</div>
                <div>
                    <div style="font-weight:700;" th:text="${user.fullName}">Admin</div>
                    <div style="font-size:0.72rem; color:var(--muted);">System Administrator</div>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="card">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;">
                    <h2 style="margin:0;">Patient Records</h2>
                    <button type="button" class="action-btn" id="togglePatientEdit">Refresh records</button>
                </div>
                <table>
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Department</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="patientTableBody"></tbody>
                </table>
            </div>
        </main>
    </div>
</div>
<script>
    const sidebar = document.getElementById('sidebar');
    document.getElementById('toggleSidebar').addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
    });

    const patientTableBody = document.getElementById('patientTableBody');

    async function loadPatients() {
        const response = await fetch('/api/patients', {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include'
        });
        if (!response.ok) {
            console.error('Failed to load patients:', response.status);
            throw new Error('Unable to load patients');
        }
        const patients = await response.json();
        console.log('Patients loaded:', patients.length, 'records');
        return patients;
    }

    async function renderPatients() {
        try {
            const patients = await loadPatients();
            patientTableBody.innerHTML = patients.length ? patients.map(patient => `
                <tr data-id="${patient.id}">
                    <td><span class="cell-text">${patient.name}</span></td>
                    <td><span class="cell-text">${patient.age ?? ''}</span></td>
                    <td><span class="cell-text">${patient.department ?? ''}</span></td>
                    <td><span class="badge ${patient.status === 'Active' || patient.status === 'Stable' ? 'success' : 'warning'}">${patient.status}</span></td>
                    <td style="display:flex; gap:8px;">
                        <button type="button" class="row-edit-btn" data-patient='${JSON.stringify(patient)}'>Edit</button>
                        <button type="button" class="row-edit-btn" style="background:#fee2e2; color:#dc2626;" data-patient-id="${patient.id}" data-action="delete">Delete</button>
                    </td>
                </tr>
            `).join('') : '<tr><td colspan="5" style="text-align:center; color:#64748b; padding:24px;">No patient records available.</td></tr>';
            patientTableBody.querySelectorAll('.row-edit-btn').forEach(button => {
                if (button.dataset.action === 'delete') {
                    button.addEventListener('click', deletePatient);
                } else {
                    button.addEventListener('click', editPatient);
                }
            });
        } catch (error) {
            patientTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#b91c1c; padding:24px;">Patient records could not be loaded.</td></tr>';
        }
    }

    function deletePatient() {
        const patientId = this.dataset.patientId;
        if (confirm('Are you sure you want to delete this patient record?')) {
            fetch('/api/patients/' + patientId, { 
                method: 'DELETE',
                credentials: 'include'
            })
                .then(response => {
                    if (!response.ok) throw new Error();
                    renderPatients();
                })
                .catch(() => alert('The patient record could not be deleted.'));
        }
    }

    function editPatient() {
            const patient = JSON.parse(this.dataset.patient);
            const row = this.closest('tr');
            const nameCell = row.children[0];
            const ageCell = row.children[1];
            const departmentCell = row.children[2];
            const statusCell = row.children[3];

            if (this.classList.contains('save-btn')) {
                const nameInput = row.querySelector('input[name="name"]');
                const ageInput = row.querySelector('input[name="age"]');
                const departmentInput = row.querySelector('input[name="department"]');
                const statusInput = row.querySelector('select[name="status"]');

                fetch('/api/patients/' + row.dataset.id, { 
                    method:'PUT', 
                    headers:{'Content-Type':'application/json'}, 
                    credentials: 'include',
                    body:JSON.stringify({
                        name:nameInput.value, 
                        age:ageInput.value ? Number(ageInput.value) : null, 
                        department:departmentInput.value, 
                        status:statusInput.value
                    })
                }).then(response => { 
                    if (!response.ok) throw new Error(); 
                    return renderPatients(); 
                }).catch(() => alert('The patient record could not be saved.'));
                return;
            }

            nameCell.innerHTML = '<input type="text" name="name" value="' + patient.name + '" />';
            ageCell.innerHTML = '<input type="number" name="age" value="' + (patient.age ?? '') + '" />';
            departmentCell.innerHTML = '<input type="text" name="department" value="' + (patient.department ?? '') + '" />';
            statusCell.innerHTML = '<select name="status"><option>Active</option><option>Review</option><option>Stable</option></select>';
            statusCell.querySelector('select').value = patient.status || 'Active';
            this.textContent = 'Save';
            this.classList.add('save-btn');
    }

    document.getElementById('togglePatientEdit').addEventListener('click', renderPatients);
    renderPatients();
</script>
</body>
</html>
