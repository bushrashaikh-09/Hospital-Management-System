<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --primary:#2563eb; --success:#16a34a; --warning:#eab308; --danger:#dc2626;
        }
        * { box-sizing: border-box; }
        body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); }
        .container { max-width:1200px; margin:40px auto; padding:0 20px; }
        .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .title { font-size:2rem; font-weight:800; }
        .btn { border:none; border-radius:12px; padding:12px 16px; font-weight:700; cursor:pointer; }
        .btn-primary { background:linear-gradient(135deg,#2563eb,#0ea5e9); color:#fff; }
        .btn-secondary { background:#eef2ff; color:#312e81; }
        .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 16px 35px rgba(15,23,42,0.04); }
        .grid { display:grid; grid-template-columns:1.2fr 0.8fr; gap:24px; }
        form { display:grid; gap:14px; }
        .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        label { display:block; font-weight:600; margin-bottom:6px; }
        input, select, textarea { width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; }
        textarea { min-height:90px; resize:vertical; }
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th, td { text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); }
        th { color:var(--muted); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.06em; }
        .status { display:inline-flex; padding:6px 10px; border-radius:999px; font-size:0.72rem; font-weight:700; }
        .status.completed { background:#dcfce7; color:#166534; }
        .status.pending { background:#fef3c7; color:#92400e; }
        .status.failed { background:#fee2e2; color:#991b1b; }
        .metrics { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .metric-box { background:#f8fafc; border:1px solid var(--line); border-radius:14px; padding:18px; }
        .metric-label { color:var(--muted); font-size:0.8rem; }
        .metric-value { font-size:1.8rem; font-weight:800; margin-top:6px; }
        .muted { color:var(--muted); }
        .empty { text-align:center; color:var(--muted); padding:24px; }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <div>
            <div class="muted">Finance</div>
            <div class="title">Payment History</div>
        </div>
        <div>
            <a href="/admin/dashboard" class="btn btn-secondary" style="text-decoration:none; display:inline-block;">Back to dashboard</a>
            <a href="/admin/invoices" class="btn btn-secondary" style="text-decoration:none; display:inline-block;">Invoices</a>
        </div>
    </div>

    <div class="card">
        <div class="grid">
            <div>
                <h3 style="margin-top:0;">Record payment</h3>
                <form id="paymentForm">
                    <input type="hidden" id="paymentId">
                    <div class="two-col">
                        <div>
                            <label>Patient name</label>
                            <input id="patientName" required>
                        </div>
                        <div>
                            <label>Invoice number</label>
                            <select id="invoiceNumber">
                                <option value="">Select invoice</option>
                            </select>
                        </div>
                    </div>
                    <div class="two-col">
                        <div>
                            <label>Amount</label>
                            <input id="amount" type="number" min="0" step="0.01" required>
                        </div>
                        <div>
                            <label>Payment method</label>
                            <select id="paymentMethod">
                                <option value="Credit Card">Credit Card</option>
                                <option value="Debit Card">Debit Card</option>
                                <option value="Internet Banking">Internet Banking</option>
                                <option value="UPI">UPI</option>
                            </select>
                        </div>
                    </div>
                    <div class="two-col">
                        <div>
                            <label>Payment date</label>
                            <input type="date" id="paymentDate" required>
                        </div>
                        <div>
                            <label>Status</label>
                            <select id="status">
                                <option value="Completed">Completed</option>
                                <option value="Pending">Pending</option>
                                <option value="Failed">Failed</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label>Notes</label>
                        <textarea id="notes" placeholder="Payment reference or remarks"></textarea>
                    </div>
                    <div style="display:flex; gap:12px;">
                        <button class="btn btn-primary" type="submit">Save payment</button>
                        <button class="btn btn-secondary" type="button" id="cancelEdit">Cancel</button>
                    </div>
                </form>
            </div>
            <div>
                <h3 style="margin-top:0;">Summary</h3>
                <div class="metrics">
                    <div class="metric-box">
                        <div class="metric-label">Total collected</div>
                        <div id="totalCollected" class="metric-value">₹0.00</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">Transactions</div>
                        <div id="transactionCount" class="metric-value">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top:28px;">
        <h3 style="margin-top:0;">Recent payments</h3>
        <table>
            <thead>
            <tr>
                <th>Receipt</th>
                <th>Patient</th>
                <th>Invoice</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="paymentTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const paymentForm = document.getElementById('paymentForm');
    const paymentTableBody = document.getElementById('paymentTableBody');
    const totalCollected = document.getElementById('totalCollected');
    const transactionCount = document.getElementById('transactionCount');
    const invoiceNumberSelect = document.getElementById('invoiceNumber');

    const formatCurrency = (value) => {
        const amount = Number(value || 0);
        return '₹' + amount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    async function loadInvoiceOptions() {
        const invoiceResponse = await fetch('/api/invoices');
        if (!invoiceResponse.ok) {
            invoiceNumberSelect.innerHTML = '<option value="">Select invoice</option>';
            return;
        }

        const invoices = await invoiceResponse.json();
        invoiceNumberSelect.innerHTML = '<option value="">Select invoice</option>' + invoices.map(invoice => `
            <option value="${invoice.invoiceNumber || ''}">${invoice.invoiceNumber || 'Unknown'} - ${invoice.patientName || 'Patient'}</option>
        `).join('');
    }

    function resetForm() {
        paymentForm.reset();
        document.getElementById('paymentId').value = '';
        document.getElementById('paymentDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('status').value = 'Completed';
        document.getElementById('paymentMethod').value = 'Cash';
        loadInvoiceOptions();
    }

    async function loadPayments() {
        const response = await fetch('/api/payments');
        if (!response.ok) {
            paymentTableBody.innerHTML = '<tr><td colspan="8" class="empty">Unable to load payment history.</td></tr>';
            return;
        }

        const payments = await response.json();
        const total = payments.reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
        totalCollected.textContent = formatCurrency(total);
        transactionCount.textContent = String(payments.length || 0);

        if (!payments.length) {
            paymentTableBody.innerHTML = '<tr><td colspan="8" class="empty">No payments recorded yet.</td></tr>';
            return;
        }

        paymentTableBody.innerHTML = payments.map(payment => `
            <tr>
                <td>${payment.receiptNumber || 'N/A'}</td>
                <td>${payment.patientName || '-'}</td>
                <td>${payment.invoiceNumber || '-'}</td>
                <td>${formatCurrency(payment.amount)}</td>
                <td>${payment.paymentMethod || 'Cash'}</td>
                <td>${payment.paymentDate || '-'}</td>
                <td><span class="status ${String(payment.status || 'completed').toLowerCase()}">${payment.status || 'Completed'}</span></td>
                <td>
                    <button class="btn btn-secondary" type="button" data-edit="${payment.id}" style="padding:8px 10px;">Edit</button>
                    <button class="btn btn-primary" type="button" data-delete="${payment.id}" style="padding:8px 10px; background:#ef4444; color:white;">Delete</button>
                </td>
            </tr>
        `).join('');

        document.querySelectorAll('[data-edit]').forEach(button => {
            button.addEventListener('click', async () => {
                const id = button.dataset.edit;
                const response = await fetch('/api/payments');
                const paymentsData = await response.json();
                const payment = paymentsData.find(item => String(item.id) === String(id));
                if (!payment) return;

                document.getElementById('paymentId').value = payment.id;
                document.getElementById('patientName').value = payment.patientName || '';
                invoiceNumberSelect.value = payment.invoiceNumber || '';
                document.getElementById('amount').value = payment.amount || 0;
                document.getElementById('paymentMethod').value = payment.paymentMethod || 'Cash';
                document.getElementById('paymentDate').value = payment.paymentDate || new Date().toISOString().split('T')[0];
                document.getElementById('status').value = payment.status || 'Completed';
                document.getElementById('notes').value = payment.notes || '';
            });
        });

        document.querySelectorAll('[data-delete]').forEach(button => {
            button.addEventListener('click', async () => {
                const confirmed = confirm('Delete this payment record?');
                if (!confirmed) return;
                const response = await fetch(`/api/payments/${button.dataset.delete}`, { method: 'DELETE' });
                if (response.ok) {
                    loadPayments();
                }
            });
        });
    }

    paymentForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const id = document.getElementById('paymentId').value;
        const payload = {
            patientName: document.getElementById('patientName').value,
            invoiceNumber: invoiceNumberSelect.value,
            amount: Number(document.getElementById('amount').value || 0),
            paymentMethod: document.getElementById('paymentMethod').value,
            paymentDate: document.getElementById('paymentDate').value,
            status: document.getElementById('status').value,
            notes: document.getElementById('notes').value
        };

        const url = id ? `/api/payments/${id}` : '/api/payments';
        const method = id ? 'PUT' : 'POST';

        const response = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            const error = await response.text();
            alert(error || 'Unable to save payment.');
            return;
        }

        resetForm();
        loadPayments();
    });

    document.getElementById('cancelEdit').addEventListener('click', resetForm);
    resetForm();
    loadPayments();
</script>
</body>
</html>
